# - PATCH: Bug fixes, documentation updates

# =============================================================================
# Global Settings
# =============================================================================

# Hide Nginx version number for security
server_tokens off;

# WebSocket/SSE support - dynamic Connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# =============================================================================
# Default Server Block (blocks direct IP access)
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Self-signed certificate for default block (required for SSL to work)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Block direct IP access - close connection without response
    return 444;
}

# =============================================================================
# Health Check Endpoint (for Docker healthcheck)
# =============================================================================

server {
    listen 80;
    server_name localhost;

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 444;
    }
}

