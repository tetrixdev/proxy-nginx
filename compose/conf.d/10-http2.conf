# HTTP/2, for every domain this proxy serves.
# Version: 1.0.0
# Last Updated: 2026-10-25
#
# Managed by: PocketDev Server Manager
# Repository: https://github.com/tetrixdev/proxy-nginx
#
# WHY THIS EXISTS
#
# Under HTTP/1.1 a connection carries one request at a time, so a browser opens
# several and caps itself at SIX PER ORIGIN. That is invisible for ordinary
# traffic, where a request finishes in milliseconds and hands its connection
# straight back. It is not invisible for anything that STREAMS: a Server-Sent
# Events connection holds one of the six for as long as the page wants it.
#
# An app that opens a few streams at once -- a chat with several conversations
# on screen, a dashboard with several live panels -- therefore spends its whole
# connection budget, and the next ordinary request simply waits. Not an error,
# not a timeout: it sits in the browser's own queue until a stream ends, which
# can be minutes. Measured on an app behind this proxy before this change: with
# five streams open, an ordinary fetch never returned at all.
#
# What that looks like to whoever is using it has nothing to do with
# connections. A form appears to do nothing when submitted. A page loads empty.
# It reads exactly like a server that has stopped answering -- and then fixes
# itself later when some stream times out, so it is nearly unreportable.
#
# HTTP/2 carries many interleaved streams over ONE connection, so the six-
# connection cap stops applying.
#
# WHY IT IS ITS OWN FILE
#
# `conf.d/default.conf` holds every domain block domain.sh has ever written,
# so install.sh deliberately never replaces it on an upgrade. A global setting
# put in there would only ever reach brand-new installs. This file carries no
# state, so install.sh can lay it down every run, the way it already does for
# compose.yml.
#
# Setting it here, in the http context, also means it survives `domain.sh
# upsert`: that regenerates a server block from its own template plus whatever
# `listen 443` / `ssl_*` lines certbot had put there, so an `http2 on;` added
# inside a server block by hand is erased the next time that domain is touched.
#
# SCOPE
#
# nginx applies this to TLS listeners via ALPN, which is what browsers use. On
# port 80 it permits cleartext HTTP/2 for a client that asks for it by prior
# knowledge; no browser does, and an ordinary HTTP/1.1 request to port 80 is
# unaffected -- verified, not assumed.
#
# Requires nginx 1.25.1+ for this form of the directive. The base image is
# nginx:1.27-alpine, and the older `listen ... http2` form is deliberately not
# used: it lives on the listen line, which is exactly the line certbot rewrites.

http2 on;
