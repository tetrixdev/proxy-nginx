services:
  proxy-nginx:
    image: ghcr.io/tetrixdev/proxy-nginx:REPLACE_WITH_VERSION
    container_name: proxy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      # Mount the DIRECTORY, not the file. A single-file bind mount binds the inode, so
      # any host-side tool that rewrites the file by replace-and-rename (sed -i, mv, and
      # most editors) leaves the container attached to the old, orphaned inode. Host and
      # container then silently diverge: domain.sh writes inside the container land on the
      # orphan, work fine, and vanish on the next container start. A directory mount
      # resolves the path on every open, so it survives any rewrite. It also holds the
      # stateless fragments install.sh lays down (10-http2.conf).
      - ./conf.d:/etc/nginx/conf.d
    networks:
      - main-network
    restart: always
    logging:
      driver: journald
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  main-network:
    name: main-network
