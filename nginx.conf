# Nginx main configuration
# Version: 1.0.0
# Last Updated: 2026-10-25
#
# Managed by: PocketDev Server Manager
# Repository: https://github.com/tetrixdev/proxy-nginx
#
# The base image's (nginx:1.27-alpine) own nginx.conf, with ONE change: the
# access log records the request line with any `token=` / `access_token=` query
# value replaced by [REDACTED].
#
# WHY
#
# The default format logs "$request", query string included, and this log goes
# to journald on the host, where it is kept and read. Some clients put a
# long-lived credential in the URL of a WebSocket upgrade (for example
# `/bridge?device=...&token=...`), so the proxy would keep those credentials in
# plain text. Fixing the client is the real fix, but an old client keeps
# connecting until it updates, and the next client to make the same mistake
# will not ask first. Masking here holds for all of them.
#
# WHY IN THE IMAGE, NOT conf.d
#
# `access_log` at http level in conf.d would ADD a second log beside this one
# rather than replace it, and a log_format name cannot be redefined. A
# server-level override would have to be in every block domain.sh writes and
# would reach only domains upserted after the change. Shipping the whole file in
# the image changes every domain on the next image pull, with nothing to migrate.
#
# Only the first token= in a request line is masked; a request with two is not
# a pattern any known client uses.
#
# When bumping the base image, diff this against its stock /etc/nginx/nginx.conf
# (docker run --rm nginx:<tag> cat /etc/nginx/nginx.conf) and carry over any
# change; this file replaces it entirely.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $request $request_masked {
        "~^(?<req_pre>.*[?&](?:access_)?token=)[^& ]*(?<req_post>.*)$" "${req_pre}[REDACTED]${req_post}";
        default $request;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_masked" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
